name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q HandMouse.zip
      - name: Fix gradle.properties
        run: printf 'android.useAndroidX=true\norg.gradle.jvmargs=-Xmx2g\n' > HandMouse/gradle.properties
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build
        working-directory: HandMouse
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: HandMouse-apk
          path: HandMouse/app/build/outputs/apk/debug/app-debug.apk
